services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: trips
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d trips"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/trips
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-this-key-before-sharing}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    command: ["sh", "-c", "npm install && npm run dev"]
    depends_on:
      - api

volumes:
  pgdata:
  frontend_node_modules:
